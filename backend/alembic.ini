# Two independent migration trees: `alembic -n app ...` and `alembic -n creds ...`.
# Database URLs come from Settings (APP_DB_URL / CREDS_DB_URL), not from this file.

[app]
script_location = %(here)s/migrations/app
prepend_sys_path = .
version_locations = %(here)s/migrations/app/versions
file_template = %%(rev)s_%%(slug)s

[creds]
script_location = %(here)s/migrations/creds
prepend_sys_path = .
version_locations = %(here)s/migrations/creds/versions
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
