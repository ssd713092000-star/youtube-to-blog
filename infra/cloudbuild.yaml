# Build -> test -> push -> migrate -> deploy. Run with:
#   gcloud builds submit --config infra/cloudbuild.yaml --substitutions=_FIREBASE_API_KEY=...,_FIREBASE_APP_ID=...
# The services authenticate to GCP with their own service accounts (ADC); no key files anywhere.
substitutions:
  _REGION: us-east1
  _REPO: tube2dev
  _INSTANCE: tube2dev-pg
  _ENV: stage
  # Cloud Run URLs are deterministic: https://<service>-<project number>.<region>.run.app
  _API_URL: https://tube2dev-api-${PROJECT_NUMBER}.${_REGION}.run.app
  _WEB_URL: https://tube2dev-web-${PROJECT_NUMBER}.${_REGION}.run.app
  _DEV_USERS: ""          # comma-separated Google accounts that get DB access for local dev
  _FIREBASE_API_KEY: ""
  _FIREBASE_APP_ID: ""

serviceAccount: projects/$PROJECT_ID/serviceAccounts/sa-build@$PROJECT_ID.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

steps:
  - id: backend-image
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID", "backend"]

  - id: backend-tests
    name: ghcr.io/astral-sh/uv:0.12.11-python3.13-bookworm
    dir: backend
    entrypoint: bash
    args: ["-c", "uv sync --frozen && uv run ruff check app tests && uv run pytest tests -q --ignore=tests/integration"]

  - id: web-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_AUTH_MODE=firebase
      - --build-arg=NEXT_PUBLIC_RELEASE=$BUILD_ID
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$PROJECT_ID.firebaseapp.com
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - frontend

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID && docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID"]

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy tube2dev-migrate --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID \
          --service-account sa-migrate@$PROJECT_ID.iam.gserviceaccount.com \
          --set-cloudsql-instances $PROJECT_ID:${_REGION}:${_INSTANCE} \
          --command python --args=-m,app.cli,migrate \
          --set-env-vars "^@^ENV=${_ENV}@GCP_PROJECT=$PROJECT_ID@APP_DB_URL=postgresql+psycopg://sa-migrate%40$PROJECT_ID.iam@/tube2dev_app?host=/cloudsql/$PROJECT_ID:${_REGION}:${_INSTANCE}@CREDS_DB_URL=postgresql+psycopg://sa-migrate%40$PROJECT_ID.iam@/tube2dev_credentials?host=/cloudsql/$PROJECT_ID:${_REGION}:${_INSTANCE}@DB_APP_GRANTEES=sa-api@$PROJECT_ID.iam,sa-worker@$PROJECT_ID.iam,${_DEV_USERS}@DB_CREDS_GRANTEES=sa-api@$PROJECT_ID.iam,sa-worker@$PROJECT_ID.iam,${_DEV_USERS}@AUTH_MODE=firebase@TASK_MODE=cloud_tasks@DB_IAM_AUTH=true" \
          --execute-now --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID
        SQL=$PROJECT_ID:${_REGION}:${_INSTANCE}
        common="ENV=${_ENV}@GCP_PROJECT=$PROJECT_ID@REGION=${_REGION}@GCS_BUCKET=$PROJECT_ID-tube2dev-content@KMS_KEY_NAME=projects/$PROJECT_ID/locations/${_REGION}/keyRings/tube2dev/cryptoKeys/user-api-keys@TASK_MODE=cloud_tasks@TASKS_QUEUE=graph-runs@TASKS_INVOKER_SA=sa-tasks-invoker@$PROJECT_ID.iam.gserviceaccount.com@AUTH_MODE=firebase@FIREBASE_PROJECT_ID=$PROJECT_ID@WEB_ORIGINS=${_WEB_URL}@YT_PROXY_SECRET=projects/$PROJECT_ID/secrets/yt-proxy-credentials/versions/latest@LANGGRAPH_STRICT_MSGPACK=true@DB_IAM_AUTH=true"
        db() { echo "APP_DB_URL=postgresql+psycopg://$1%40$PROJECT_ID.iam@/tube2dev_app?host=/cloudsql/$SQL@CREDS_DB_URL=postgresql+psycopg://$1%40$PROJECT_ID.iam@/tube2dev_credentials?host=/cloudsql/$SQL"; }

        # DB_IAM_AUTH=true: each service logs into Cloud SQL as its own IAM user over the built-in
        # /cloudsql socket, using a short-lived ADC token as the password (app/db/iam.py).
        gcloud run deploy tube2dev-worker --region ${_REGION} --image $IMG \
          --service-account sa-worker@$PROJECT_ID.iam.gserviceaccount.com --no-allow-unauthenticated \
          --ingress internal-and-cloud-load-balancing --timeout 3600 --concurrency 4 --cpu 1 --memory 1Gi \
          --set-cloudsql-instances $SQL --command sh --args=-c,"exec uvicorn app.main_worker:app --host 0.0.0.0 --port 8080" \
          --set-env-vars "^@^$common@SERVICE_NAME=tube2dev-worker@$(db sa-worker)"
        WORKER_URL=$(gcloud run services describe tube2dev-worker --region ${_REGION} --format 'value(status.url)')

        gcloud run deploy tube2dev-api --region ${_REGION} --image $IMG \
          --service-account sa-api@$PROJECT_ID.iam.gserviceaccount.com --allow-unauthenticated \
          --timeout 3600 --min-instances 1 --cpu 1 --memory 1Gi --set-cloudsql-instances $SQL \
          --set-env-vars "^@^$common@SERVICE_NAME=tube2dev-api@WORKER_URL=$WORKER_URL@$(db sa-api)"

        gcloud run jobs deploy tube2dev-cleanup --region ${_REGION} --image $IMG \
          --service-account sa-worker@$PROJECT_ID.iam.gserviceaccount.com --set-cloudsql-instances $SQL \
          --command python --args=-m,app.cli,cleanup \
          --set-env-vars "^@^$common@SERVICE_NAME=tube2dev-cleanup@$(db sa-worker)"

        gcloud run deploy tube2dev-web --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID \
          --service-account sa-web@$PROJECT_ID.iam.gserviceaccount.com --allow-unauthenticated \
          --set-env-vars GCP_PROJECT=$PROJECT_ID

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID
